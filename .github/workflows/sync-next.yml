# Merge the synced mainline-check branches into the branches the Sunlight
# kernel packages are built from, as "SUNLIGHT: Mainline <date> - ANDROID"
# merge commits:
#   mainline-check      -> next       (linux-next)
#   mainline-check-full -> next-full  (linux-next-full)
#
# Runs after every "Sync android-mainline" run, so AOSP lands in
# mainline-check first and then moves on here; it also runs when that sync
# failed, because a branch it did not update has nothing new to merge. Lives
# on the default branch because workflow_run only fires from there. The merge
# is done with `git merge-tree` in a blobless bare clone, so no kernel working
# tree is checked out on the runner.

name: Sync next

on:
  workflow_run:
    workflows: ['Sync android-mainline']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-next
  cancel-in-progress: false

env:
  GIT_AUTHOR_NAME: Ionut Nechita
  GIT_AUTHOR_EMAIL: ionut_n2001@yahoo.com
  GIT_COMMITTER_NAME: Ionut Nechita
  GIT_COMMITTER_EMAIL: ionut_n2001@yahoo.com

jobs:
  sync:
    name: ${{ matrix.source }} -> ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: mainline-check
            target: next
          - source: mainline-check-full
            target: next-full
    env:
      SOURCE_BRANCH: ${{ matrix.source }}
      TARGET_BRANCH: ${{ matrix.target }}
    steps:
      - name: Clone target branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --bare --filter=blob:none --single-branch \
            --branch "$TARGET_BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo.git

      - name: Fetch source branch
        working-directory: repo.git
        run: |
          git fetch --filter=blob:none --no-tags origin \
            "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"

      - name: Merge and push
        working-directory: repo.git
        run: |
          base=$(git rev-parse "refs/heads/${TARGET_BRANCH}")
          source=$(git rev-parse "refs/remotes/origin/${SOURCE_BRANCH}")

          if git merge-base --is-ancestor "$source" "$base"; then
            echo "${TARGET_BRANCH} already contains ${SOURCE_BRANCH} (${source:0:12})."
            exit 0
          fi

          if ! tree=$(git merge-tree --write-tree --name-only "$base" "$source"); then
            echo "::error::Merge conflict between ${TARGET_BRANCH} and ${SOURCE_BRANCH}; resolve manually."
            echo "$tree"
            exit 1
          fi

          date=$(TZ=Europe/Bucharest date +%-m/%-d/%Y)
          change_id="I$(printf '%s\n' "$tree" "$base" "$source" "$(date +%s%N)" | git hash-object --stdin)"

          commit=$(git commit-tree "$tree" -p "$base" -p "$source" -F - <<EOF
          SUNLIGHT: Mainline ${date} - ANDROID

          Description:
           - Mainline ${date} - ANDROID

          Change-Id: ${change_id}
          Signed-off-by: ${GIT_AUTHOR_NAME} <${GIT_AUTHOR_EMAIL}>
          EOF
          )

          git log -1 --format='%H%n%B' "$commit"

          # Unlike the AOSP sync, every blob the merge needs is already on
          # origin (both parents are its own branches), so the blobless clone
          # lazy-fetches what merge-tree reads and the push sends only the new
          # merge commit, its trees and any blobs the merge itself created.
          git push origin "${commit}:refs/heads/${TARGET_BRANCH}"

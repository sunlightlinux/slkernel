# Merge new commits from AOSP kernel/common upstream branches into their
# Sunlight counterparts, as "SUNLIGHT: Mainline <date> - ANDROID" merge
# commits:
#   android-mainline         -> mainline-check
#   android-mainline-desktop -> mainline-check-full
#
# Lives on the default branch because scheduled workflows only run from there.
# The merge is done with `git merge-tree` in a blobless bare clone, so no
# kernel working tree is checked out on the runner.

name: Sync android-mainline

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-android-mainline
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://android.googlesource.com/kernel/common
  GIT_AUTHOR_NAME: Ionut Nechita
  GIT_AUTHOR_EMAIL: ionut_n2001@yahoo.com
  GIT_COMMITTER_NAME: Ionut Nechita
  GIT_COMMITTER_EMAIL: ionut_n2001@yahoo.com

jobs:
  sync:
    name: ${{ matrix.upstream }} -> ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - upstream: android-mainline
            target: mainline-check
          - upstream: android-mainline-desktop
            target: mainline-check-full
    env:
      UPSTREAM_BRANCH: ${{ matrix.upstream }}
      TARGET_BRANCH: ${{ matrix.target }}
    steps:
      - name: Clone target branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --bare --filter=blob:none --single-branch \
            --branch "$TARGET_BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo.git

      - name: Fetch upstream
        working-directory: repo.git
        run: |
          git remote add aosp "$UPSTREAM_URL"
          git fetch --filter=blob:none --no-tags aosp \
            "+refs/heads/${UPSTREAM_BRANCH}:refs/remotes/aosp/${UPSTREAM_BRANCH}"

      - name: Merge and push
        working-directory: repo.git
        run: |
          base=$(git rev-parse "refs/heads/${TARGET_BRANCH}")
          upstream=$(git rev-parse "refs/remotes/aosp/${UPSTREAM_BRANCH}")

          if git merge-base --is-ancestor "$upstream" "$base"; then
            echo "${TARGET_BRANCH} already contains ${UPSTREAM_BRANCH} (${upstream:0:12})."
            exit 0
          fi

          if ! tree=$(git merge-tree --write-tree --name-only "$base" "$upstream"); then
            echo "::error::Merge conflict between ${TARGET_BRANCH} and ${UPSTREAM_BRANCH}; resolve manually."
            echo "$tree"
            exit 1
          fi

          date=$(TZ=Europe/Bucharest date +%-m/%-d/%Y)
          change_id="I$(printf '%s\n' "$tree" "$base" "$upstream" "$(date +%s%N)" | git hash-object --stdin)"

          commit=$(git commit-tree "$tree" -p "$base" -p "$upstream" -F - <<EOF
          SUNLIGHT: Mainline ${date} - ANDROID

          Description:
           - Mainline ${date} - ANDROID

          Change-Id: ${change_id}
          Signed-off-by: ${GIT_AUTHOR_NAME} <${GIT_AUTHOR_EMAIL}>
          EOF
          )

          git log -1 --format='%H%n%B' "$commit"
          git push origin "${commit}:refs/heads/${TARGET_BRANCH}"
